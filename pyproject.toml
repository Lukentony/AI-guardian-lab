[tool.pytest.ini_options]
# Canonical package imports avoid competing main.py/intent.py instances.
pythonpath = ["."]
testpaths = ["tests"]
# Agent tests in tests/test_agent.py run normally; do not collect dependency trees.
norecursedirs = [".git", ".venv", "workspace", "state"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
