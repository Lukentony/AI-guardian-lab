services:
  guardian:
    build:
      context: .
      dockerfile: guardian/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${GUARDIAN_BIND_IP:-127.0.0.1}:${GUARDIAN_PORT:-5000}:5000"
    networks: [agent-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      LOG_HMAC_KEY: ${LOG_HMAC_KEY:-}
      TASK_API_KEY: ${TASK_API_KEY:-}
      INTENT_LLM_MODEL: ${INTENT_LLM_MODEL:-openai/qwen2.5-3b-instruct}
      INTENT_LLM_TIMEOUT_SECONDS: ${INTENT_LLM_TIMEOUT_SECONDS:-2}
      LLM_API_BASE: ${LLM_API_BASE:-http://llama:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-3b-instruct}
      FORENSICS_LLM_MODEL: ${LLM_MODEL_EXPLAIN:-qwen2.5-3b-instruct}
      DB_PATH: /var/lib/guardian/audit.db
      LEARNED_PATH: /var/lib/guardian-learned/learned_patterns.yaml
      SYSTEM_ONE_URL: ${SYSTEM_ONE_URL:-http://system-one:8009/v1/systemone}
      SYSTEM_ONE_API_KEY: ${SYSTEM_ONE_API_KEY:-}
      SYSTEM_ONE_TIMEOUT_SECONDS: ${SYSTEM_ONE_TIMEOUT_SECONDS:-0.5}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
    volumes:
      - ./guardian/config:/app/guardian/config:ro
      - ./state/audit:/var/lib/guardian
      - ./state/learned:/var/lib/guardian-learned
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
  agent:
    build:
      context: ./agent
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${AGENT_PORT:-5001}:5001"
    networks: [agent-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GUARDIAN_URL: http://guardian:5000
      GUARDIAN_TIMEOUT_SECONDS: ${GUARDIAN_TIMEOUT_SECONDS:-5}
      LLM_PROVIDER: llama.cpp
      LLM_API_BASE: ${LLM_API_BASE:-http://llama:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_CODER: ${LLM_MODEL_CODER:-qwen2.5-3b-instruct}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      EXECUTE_COMMANDS: ${EXECUTE_COMMANDS:-false}
      EXECUTION_WORKSPACE: /workspace
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    tmpfs:
      - "/workspace:rw,size=64m,uid=${LOCAL_UID:-1000},\
        gid=${LOCAL_GID:-1000},mode=0700"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1024M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5001/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      guardian:
        condition: service_healthy
  ui:
    build:
      context: ./ui
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${UI_PORT:-8081}:8080"
    networks: [agent-net]
    environment:
      GUARDIAN_URL: http://guardian:5000
      GUARDIAN_API_KEY: ${API_KEY:?Set API_KEY in .env}
      AGENT_URL: http://agent:5001
      APP_VERSION: ${IMAGE_TAG:-1.6.0}
      UI_USERNAME: ${UI_USERNAME:-guardian}
      UI_PASSWORD: ${UI_PASSWORD:?Set UI_PASSWORD in .env}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      guardian:
        condition: service_healthy
  system-one:
    profiles: [system-one, full]
    build:
      context: ./system-one
    networks: [agent-net]
    environment:
      SYSTEM_ONE_API_KEY: ${SYSTEM_ONE_API_KEY:-}
      SYSTEM_ONE_THREADS: ${SYSTEM_ONE_THREADS:-8}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /models
      KEV_PREFIX_CACHE: "4"
      OMP_NUM_THREADS: ${SYSTEM_ONE_THREADS:-8}
      MKL_NUM_THREADS: ${SYSTEM_ONE_THREADS:-8}
    volumes:
      - system-one-models:/models
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8009/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
  llama:
    profiles: [full]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
    networks: [agent-net]
    command:
      - "--model"
      - "/models/${LLAMA_MODEL_FILE:-qwen2.5-3b-instruct-q4_k_m.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "4096"
      - "--threads"
      - "${LLAMA_THREADS:-8}"
      - "--jinja"
      - "--alias"
      - "${LLM_MODEL:-qwen2.5-3b-instruct}"
      - "--api-key"
      - "${LLM_API_KEY:?Set LLM_API_KEY in .env}"
    volumes:
      - ./state/models:/models:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

networks:
  agent-net:
    driver: bridge
volumes:
  system-one-models:
