name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Offline regression suite
        run: python -m pytest --junitxml=test-results.xml
      - name: Type checks
        run: pyright guardian database agent ui scripts tests tools
      - name: Lint changed runtime surfaces
        run: >-
          ruff check guardian database agent ui tools
          scripts/evaluate_system_one.py scripts/pattern_learner.py
          scripts/verify_logs.py
      - name: Shell syntax
        run: |
          bash -n install.sh scripts/package_release.sh
          sh -n guardian/entrypoint.sh system-one/bootstrap.sh
          sh -n scripts/validate_config.sh
      - name: Upload test results
        # actions/upload-artifact v4, immutable source revision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - name: Compose smoke test (no real command execution)
        env:
          API_KEY: ci-agent-key
          LOG_HMAC_KEY: ci-signing-key
          TASK_API_KEY: ci-operator-key
          LLM_API_KEY: ci-model-key
          UI_PASSWORD: ci-ui-password
          EXECUTE_COMMANDS: "false"
        run: |
          mkdir -p state/audit state/learned
          chmod 700 state/audit state/learned
          export LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:5000/health
          curl --fail http://127.0.0.1:5001/health
          curl --fail http://127.0.0.1:8081/health
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8081/)
          test "$status" = 401
      - name: Full-profile Compose configuration
        env:
          API_KEY: ci-agent-key
          LOG_HMAC_KEY: ci-signing-key
          TASK_API_KEY: ci-operator-key
          SYSTEM_ONE_API_KEY: ci-system-one-key
          LLM_API_KEY: ci-model-key
          UI_PASSWORD: ci-ui-password
          COMPOSE_PROFILES: full
          LLM_API_BASE: http://llama:8080/v1
          LLAMA_MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
          LLM_MODEL: qwen2.5-3b-instruct
          LLM_MODEL_CODER: qwen2.5-3b-instruct
          INTENT_LLM_MODEL: openai/qwen2.5-3b-instruct
          LLM_MODEL_EXPLAIN: qwen2.5-3b-instruct
          SYSTEM_ONE_TIMEOUT_SECONDS: "2.0"
          INTENT_LLM_TIMEOUT_SECONDS: "30"
          GUARDIAN_TIMEOUT_SECONDS: "45"
        run: docker compose config --quiet

      - name: Stop test containers
        if: always()
        run: docker compose down
        env:
          API_KEY: ci-agent-key
          LLM_API_KEY: ci-model-key
          UI_PASSWORD: ci-ui-password

  onboarding:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Create the demo configuration
        run: ./guardian-lab setup --profile demo --no-start
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Diagnose
        run: ./guardian-lab doctor
      - name: Run the deterministic demo
        run: ./guardian-lab demo --no-start
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop onboarding containers
        if: always()
        run: docker compose down
