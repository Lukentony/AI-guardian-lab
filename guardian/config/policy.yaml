version: "1.2-hardened"
mode: "enforced"
zones:
  green:
    description: "Read-only inspection and display commands"
    # df is the documented disk-inspection example.
    binaries: [ls, cat, pwd, echo, date, df]
  yellow:
    description: "Network-capable commands requiring coherent authorization"
    binaries: [curl, wget, git]
  red:
    description: "Forbidden commands"
    binaries: [rm, mv, chmod, sudo]
